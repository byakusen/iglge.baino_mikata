<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>倍の見方</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F3A5F;
    --ink-soft:#5A7391;
    --paper:#E9EFF6;
    --card:#FFFFFF;
    --rule:#D3DEEA;
    --bar-top:#9FC8EA;
    --bar-top-edge:#3C7CB5;
    --bar-base:#F7E9A2;
    --bar-base-edge:#C6A62F;
    --line:#D0347A;
    --red:#E23B2E;
    --ok:#12916A;
    --ng:#D4542B;
    --mode:#2E6FB7;
    --shadow:0 2px 0 rgba(31,58,95,.16), 0 8px 20px rgba(31,58,95,.08);
    --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:var(--font);background:var(--paper);color:var(--ink);
    -webkit-text-size-adjust:100%;overflow:hidden;
    height:100vh;height:100dvh;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:8px;
  }

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:10px;flex:none}
  h1{font-size:clamp(17px,2.6vh,25px);font-weight:800;margin:0;letter-spacing:.04em;white-space:nowrap}
  .sub{font-size:clamp(11px,1.5vh,14px);color:var(--ink-soft);white-space:nowrap;overflow:hidden}
  .score{margin-left:auto;font-size:clamp(12px,1.6vh,15px);font-weight:700;background:#fff;
         border:2px solid var(--rule);border-radius:999px;padding:4px 14px;white-space:nowrap}
  .score b{color:var(--ok);font-size:1.25em}
  .reset{font-family:var(--font);font-size:12px;font-weight:700;color:var(--ink-soft);background:#fff;
         border:2px solid var(--rule);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap}
  .reset:hover{color:var(--ink)}

  /* ---------- tabs ---------- */
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;flex:none}
  .tab{
    font-family:var(--font);font-size:clamp(14px,2.1vh,18px);font-weight:800;color:var(--ink-soft);
    background:#fff;border:2px solid var(--rule);border-bottom-width:4px;border-radius:13px;
    padding:8px 4px;cursor:pointer;transition:background .12s,color .12s;line-height:1.25;
  }
  .tab small{display:block;font-size:clamp(9px,1.2vh,11px);font-weight:500;opacity:.75}
  .tab[aria-selected="true"]{background:var(--mode);border-color:var(--mode);color:#fff}
  /* ランダムだけ、えらんでいないときは薄い黄色で目立たせる */
  .tab[data-mode="random"]{background:#FBEFA8;border-color:#E2C851;color:#6B5410}
  .tab[data-mode="random"][aria-selected="true"]{background:var(--mode);border-color:var(--mode);color:#fff}
  .tab:focus-visible{outline:3px solid #F2B441;outline-offset:2px}

  /* ---------- layout ---------- */
  .grid{flex:1;min-height:0;display:grid;grid-template-columns:1.22fr 1fr;gap:10px}
  .card{background:var(--card);border:2px solid var(--rule);border-radius:16px;
        padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0}
  .captop{display:flex;align-items:center;gap:10px;flex:none;margin-bottom:6px}
  .cap{align-self:center;font-size:11px;font-weight:800;letter-spacing:.12em;color:#fff;
       background:var(--mode);border-radius:6px;padding:3px 9px;flex:none}

  /* ---------- problem ---------- */
  #question{font-size:clamp(17px,3.1vh,28px);line-height:1.72;font-weight:500;margin:0;flex:none;overflow:auto}
  #question .num{font-weight:800;color:var(--mode);font-size:1.14em}
  #question .ask{background:linear-gradient(transparent 62%, #FFE49A 62%)}
  #figure{flex:1;min-height:0;margin-top:4px}
  #figure svg{width:100%;height:100%;display:block}
  #figure .hit{cursor:pointer}
  .figopt{flex:none;display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;
          font-size:clamp(12px,1.9vh,17px);font-weight:700;color:var(--ink-soft);
          background:#F5F8FB;border:2px solid var(--rule);border-radius:999px;padding:4px 14px}
  .figopt input{width:clamp(16px,2.3vh,21px);height:clamp(16px,2.3vh,21px);accent-color:var(--mode);margin:0}
  .figopt.on{color:var(--mode);background:#EDF4FC;border-color:var(--mode)}

  /* ---------- くらべるタブ ---------- */
  #vs{flex:1;min-height:0;display:none;flex-direction:column;gap:6px;margin-top:4px}
  #vs.show{display:flex}
  .vs-block{flex:1;min-height:0;display:flex;flex-direction:column;
            border:2px solid var(--rule);border-radius:12px;padding:3px 8px 2px;
            transition:border-color .15s,background .15s,opacity .15s}
  .vs-block.active{border-color:var(--mode);background:#FBFDFF}
  .vs-block.dim{opacity:.45}
  .vs-tag{align-self:flex-start;font-size:clamp(11px,1.7vh,15px);font-weight:800;color:#fff;
          background:var(--ink);border-radius:6px;padding:1px 11px}
  .vs-block.active .vs-tag{background:var(--mode)}
  .vs-fig{flex:1;min-height:0}
  .vs-fig svg{width:100%;height:100%;display:block}

  /* ---------- ステップ ---------- */
  #steps{display:none;gap:6px;margin-bottom:8px;flex:none}
  #steps.show{display:flex}
  .step{flex:1;font-size:clamp(11px,1.8vh,15px);font-weight:800;color:var(--ink-soft);
        background:#F5F8FB;border:2px solid var(--rule);border-radius:9px;padding:5px 3px;text-align:center}
  .step.done{color:var(--ok);border-color:#BEE3DC;background:#F1FAF8}
  .step.now{background:var(--mode);border-color:var(--mode);color:#fff}

  /* ---------- どちらをえらぶ ---------- */
  #choice{flex:1;min-height:0;display:none;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
  #choice.show{display:grid}
  .pad.hide{display:none}
  .choice{font-family:var(--font);font-size:clamp(27px,4.9vh,44px);font-weight:800;color:var(--ink);
          background:#fff;border:3px solid var(--rule);border-bottom-width:6px;border-radius:14px;
          cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  .choice:active{transform:translateY(2px);border-bottom-width:4px}
  .choice:focus-visible{outline:3px solid #F2B441;outline-offset:2px}
  .choice small{font-size:.8em;color:var(--mode);font-weight:800}

  /* ---------- expression ---------- */
  .side{position:relative}
  .row{display:flex;align-items:center;gap:8px;flex:none}
  .rowlabel{font-size:clamp(14px,2.0vh,18px);font-weight:800;color:#fff;background:var(--ink);
            border-radius:7px;padding:4px 9px;flex:none}
  .display{
    flex:1;height:clamp(66px,10vh,90px);line-height:1;display:flex;align-items:center;justify-content:flex-end;
    background:repeating-linear-gradient(#fff,#fff 34px,#F0F5FA 34px,#F0F5FA 35px);
    border:2px solid var(--rule);border-radius:11px;padding:4px 14px;
    font-size:clamp(29px,5.4vh,48px);font-weight:800;color:var(--red);letter-spacing:.06em;
    overflow-x:auto;white-space:nowrap;
  }
  .display.summary{font-size:clamp(15px,2.5vh,23px);color:var(--ink);justify-content:center;letter-spacing:0}
  .display .ph{color:#B9C7D6;font-size:clamp(14px,2.1vh,20px);font-weight:500;letter-spacing:0}
  .display .ph.gap{margin-right:clamp(12px,2vh,22px)}
  .answer{
    flex:1;height:clamp(54px,7.6vh,72px);line-height:1;display:flex;align-items:center;justify-content:center;
    border:2px dashed var(--rule);border-radius:11px;font-size:clamp(27px,4.5vh,40px);font-weight:800;color:var(--ink)
  }
  .answer.filled{border-style:solid;border-color:var(--ok);color:var(--ok);background:#F2FBF7}
  .answer .ph{color:#C3D0DC;font-size:clamp(13px,1.9vh,18px);font-weight:500}

  /* ---------- □をつかった式 ---------- */
  .display .given{color:var(--ink)}          /* アプリがはじめから出しておく部分 */
  .display .bx{color:var(--line)}            /* □（線分図の□と同じ色） */
  .figopts{flex:none;display:flex;align-items:center;gap:9px;margin-left:auto}
  #boxbar{display:none;flex:none;align-items:center;margin-bottom:7px;
          height:clamp(40px,5.8vh,56px);padding:0 14px;
          font-size:clamp(15px,2.5vh,22px);font-weight:800;color:var(--ink-soft);
          background:#F5F8FB;border:2px solid var(--rule);border-radius:11px;
          white-space:nowrap;overflow:hidden}
  #boxbar.show{display:flex}
  #boxbar.done{font-size:clamp(19px,3.6vh,33px);color:var(--ok);background:#F1FAF8;border-color:#BEE3DC}
  #boxbar .bx{color:var(--line)}
  .key.boxkey{color:var(--line);background:#FFF4F9;border-color:#F0BBD5}

  /* ---------- keypad ---------- */
  .pad{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);
       grid-template-rows:repeat(4,minmax(0,1fr));gap:7px;margin:10px 0}
  .key{
    font-family:var(--font);font-size:clamp(23px,4.2vh,36px);font-weight:800;color:var(--ink);
    background:#fff;border:2px solid var(--rule);border-bottom-width:4px;border-radius:11px;
    padding:0;cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:center;
    transition:transform .06s;
  }
  .key:active{transform:translateY(2px);border-bottom-width:2px}
  .key:focus-visible{outline:3px solid #F2B441;outline-offset:2px}
  .key.op{color:#0E7C6E;background:#F1FAF8;border-color:#BEE3DC}
  .key.util{font-size:clamp(17px,2.8vh,24px);color:#8894A4;background:#F5F8FB}

  .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;flex:none}
  .btn{font-family:var(--font);font-size:clamp(17px,2.8vh,23px);font-weight:800;border-radius:11px;
       padding:10px 6px;cursor:pointer;border:2px solid transparent;border-bottom-width:4px;transition:transform .06s}
  .btn:active{transform:translateY(2px);border-bottom-width:2px}
  .btn:focus-visible{outline:3px solid #F2B441;outline-offset:2px}
  .btn.check{background:var(--mode);border-color:rgba(0,0,0,.22);color:#fff}
  .btn.next{background:#fff;border-color:var(--rule);color:var(--ink)}

  #feedback{flex:none;margin-top:6px;height:3.1em;font-size:clamp(12px,1.8vh,16px);font-weight:700;
            line-height:1.55;overflow:hidden}
  #feedback.ok{color:var(--ok)}
  #feedback.ng{color:var(--ng)}


  /* ---------- まるつけスタンプ ---------- */
  #stamp{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
         z-index:60;pointer-events:none}
  #stamp.show{display:flex}
  #stamp img,#stamp svg{width:clamp(170px,42vh,340px);height:auto;
         filter:drop-shadow(0 10px 26px rgba(31,58,95,.28));animation:stamp 1.5s ease-out forwards}
  #stamp #stamp-maru,#stamp #stamp-batsu,#stamp #stamp-swap{display:none}
  #stamp.maru #stamp-maru{display:block}
  #stamp.batsu #stamp-batsu{display:block}
  #stamp.swap #stamp-swap{display:block}
  @keyframes stamp{
    0%{transform:scale(.35) rotate(-14deg);opacity:0}
    22%{transform:scale(1.16) rotate(4deg);opacity:1}
    34%{transform:scale(1) rotate(0deg)}
    72%{opacity:1}
    100%{transform:scale(1.04);opacity:0}
  }
  #figure svg g{animation:none;transform:none}
  @keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
  .pop{animation:pop .35s ease-out}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ---------- せまい画面：たてに2段 ---------- */
  @media (max-width:820px){
    .grid{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1.15fr)}
    .tab small{display:none}
    .sub{display:none}
    .card{padding:10px 12px}
    #question{font-size:clamp(16px,2.6vh,22px);line-height:1.65}
  }
  /* ---------- 10問チャレンジ（challenge10.js の見た目を上書き） ---------- */
  header #chal-wrap{flex:none;gap:8px}
  header .chal-btn{
    font-family:var(--font);font-size:clamp(11px,1.6vh,14px);font-weight:700;
    padding:5px 13px;border-radius:999px;white-space:nowrap;
  }
  header #chal-bar{
    gap:8px;padding:4px 13px;border-radius:999px;
    border:2px solid #E0C6EC;background:#fff;box-shadow:none;
    font-size:clamp(11px,1.5vh,14px);
  }
  header #chal-dots{font-size:clamp(12px,1.8vh,16px);letter-spacing:1px}
  .chal-card{font-family:var(--font)}
  /* チャレンジ中は、ヘッダーの席をあけるためにわきの表示を消す */
  body.chal-on .sub,
  body.chal-on .reset{display:none}
  @media (max-width:1000px){ header #chal-count{display:none} }
  @media (max-width:820px){
    header .chal-btn{font-size:12px;padding:4px 10px}
    body.chal-on .score{display:none}
  }
  /* スマホの幅：ヘッダーが切れないように、まわりも少しつめる */
  @media (max-width:560px){
    header{gap:6px}
    .score{padding:3px 9px}
    .reset{padding:4px 8px;font-size:11px}
    header .chal-btn{padding:4px 8px}
  }

  /* ---------- 画面がとても低いとき ---------- */
  @media (max-height:430px){
    body{overflow:auto}
    .grid{min-height:340px}
  }
</style>
</head>
<body>

  <header>
    <h1>倍の見方</h1>
    <span class="sub">線分図を見て、式をつくろう</span>
    <div id="chal-mount"></div>
    <span class="score">せいかい <b id="sc-ok">0</b> / <span id="sc-all">0</span> もん</span>
    <button class="reset" id="btn-reset">リセット</button>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-mode="times"    aria-selected="true">何倍<small>21 ÷ 7 = □</small></button>
    <button class="tab" role="tab" data-mode="compare"  aria-selected="false">比べる数<small>7 × 3 = □</small></button>
    <button class="tab" role="tab" data-mode="base"     aria-selected="false">元にする数<small>21 ÷ 3 = □</small></button>
    <button class="tab" role="tab" data-mode="random"   aria-selected="false">ランダム<small>3つがまざる</small></button>
    <button class="tab" role="tab" data-mode="versus"   aria-selected="false">比べる<small>どちらがよくのびる</small></button>
  </div>

  <div class="grid">
    <!-- 左：問題と線分図 -->
    <div class="card">
      <div class="captop">
        <span class="cap" id="cap">もんだい</span>
        <div class="figopts" id="figopts">
          <label class="figopt" id="figopt"><input type="checkbox" id="hidefig">図の表示をかくす</label>
          <label class="figopt" id="boxopt"><input type="checkbox" id="usebox">□をつかった式</label>
        </div>
      </div>
      <p id="question"></p>
      <div id="figure"></div>
      <div id="vs">
        <div class="vs-block" id="vsA"><span class="vs-tag" id="vstagA"></span><div class="vs-fig" id="vsfigA"></div></div>
        <div class="vs-block" id="vsB"><span class="vs-tag" id="vstagB"></span><div class="vs-fig" id="vsfigB"></div></div>
      </div>
    </div>

    <!-- 右：式づくり -->
    <div class="card side">
      <div id="steps">
        <div class="step" id="st1">① ゴムA</div>
        <div class="step" id="st2">② ゴムB</div>
        <div class="step" id="st3">③ くらべる</div>
      </div>
      <div id="boxbar"><span id="boxbar-txt"></span></div>

      <div class="row">
        <span class="rowlabel">式</span>
        <div class="display" id="display"><span class="ph">キーをおして式をつくろう</span></div>
      </div>

      <div class="pad">
        <button class="key" data-k="7">7</button>
        <button class="key" data-k="8">8</button>
        <button class="key" data-k="9">9</button>
        <button class="key op" data-k="÷">÷</button>
        <button class="key" data-k="4">4</button>
        <button class="key" data-k="5">5</button>
        <button class="key" data-k="6">6</button>
        <button class="key op" data-k="×">×</button>
        <button class="key" data-k="1">1</button>
        <button class="key" data-k="2">2</button>
        <button class="key" data-k="3">3</button>
        <button class="key op" data-k="−">−</button>
        <button class="key" data-k="0">0</button>
        <button class="key util" data-k="C" id="key-clear">C</button>
        <button class="key util" data-k="back">◀けす</button>
        <button class="key op" data-k="＋">＋</button>
      </div>

      <div id="choice">
        <button class="choice" id="ch-A"></button>
        <button class="choice" id="ch-B"></button>
      </div>

      <div class="row">
        <span class="rowlabel">答え</span>
        <div class="answer" id="answer"><span class="ph">まるつけをするとでます</span></div>
      </div>

      <div class="acts">
        <button class="btn check" id="btn-check">まるつけ</button>
        <button class="btn next"  id="btn-next">つぎのもんだい ▶</button>
      </div>

      <div id="feedback"></div>
    </div>
  </div>

<script>
/* ============================================================
   challenge10.js  —  「10問チャレンジ」だけを取り出したもの
   ------------------------------------------------------------
   もと：warizan81_kangae.html（小数のかけ算とわり算の筆算）⑪81
   どんなアプリでも使えるように、CSS と HTML も中に入れてあります。
   ほかのファイルは いりません（ライブラリなし・ネットもいらない）。

   ■ 使いかた（3つ呼ぶだけ）
     1. Challenge10.init({ mount: '#どこか', next: () => 次の問題を出す関数() })
     2. 1問できたら          Challenge10.done()
     3. まちがえたら          Challenge10.miss()

   ■ そのほか
     Challenge10.newProblem()  … 新しい問題を出したとき（その問題のミス数を0に）
     Challenge10.reset()       … 数えなおす（タブを変えたときなど）
     Challenge10.isOn()        … いまチャレンジ中か
     Challenge10.stop()        … チャレンジをやめる
     Challenge10.state         … {on, total, no, miss, missNow, perfect, t0}

   ■ init に わたせるもの（ぜんぶ省略できます）
     mount       ボタンを置く場所。'#id' か 要素。省略すると <body> の先頭
     total       何問にするか（初期値 10）
     next        次の問題を出す関数。これがないと自動で次に進みません
     nextDelay   はなまるから次の問題までの待ち時間 ms（初期値 1800）
     resultDelay 最後の問題から成せき表までの待ち時間 ms（初期値 1500）
     label       ボタンの文字（初期値 '🏁 10問チャレンジ'）
     sound       ボタンを押したとき鳴らす関数（例: () => playSound('click')）
     onToggle    on/off が変わったとき呼ばれる関数 (on) => {}
     onFinish    10問おわったとき呼ばれる関数 (成せき) => {}
     record      true にすると、その日の最高記録を localStorage に残す
     recordKey   記録の名前（アプリごとに変える。初期値 'challenge10'）
     css         false にすると 見た目のCSSを入れない（自分で書くとき）
   ============================================================ */
(function (global) {
    'use strict';

    var CSS = `
    .chal-btn {
        font-size: 1rem; font-weight: bold; color: #6a1b9a;
        background: #f3e5f5; border: 2px solid #ce93d8; border-radius: 20px;
        padding: 7px 16px; box-shadow: 0 2px 0 #ce93d8; cursor: pointer;
        font-family: inherit;
    }
    .chal-btn.on { color: #fff; background: #8e24aa; border-color: #6a1b9a; box-shadow: 0 2px 0 #4a148c; }
    .chal-btn:focus-visible, .chal-btns button:focus-visible { outline: 3px solid #8e24aa; outline-offset: 2px; }
    #chal-bar {
        display: none; align-items: center; gap: 10px;
        background: rgba(255,255,255,0.9); border-radius: 20px; padding: 6px 16px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        font-weight: bold; color: #6a1b9a; white-space: nowrap;
    }
    #chal-dots { color: #8e24aa; letter-spacing: 2px; font-size: 1.05rem; }
    #chal-wrap { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    /* おわったときの成せき表 */
    #chal-result {
        display: none; position: fixed; left: 0; top: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.45); z-index: 900;
        align-items: center; justify-content: center;
    }
    #chal-result.show { display: flex; }
    .chal-card {
        background: #fff; border-radius: 20px; padding: 28px 34px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.3); text-align: center; max-width: 90vw;
    }
    .chal-title { font-size: 1.8rem; font-weight: bold; color: #8e24aa; margin-bottom: 14px; }
    .chal-lines { font-size: 1.25rem; font-weight: bold; color: #333; line-height: 2; }
    .chal-lines b { color: #e53935; font-size: 1.5rem; }
    .chal-msg { margin-top: 10px; color: #ff6f00; }
    .chal-best { margin-top: 6px; font-size: 1rem; color: #6a1b9a; }
    .chal-btns { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }
    .chal-btns button {
        padding: 12px 20px; font-size: 1.1rem; font-weight: bold; font-family: inherit;
        border-radius: 14px; cursor: pointer; border: none;
    }
    #btn-chal-again { color: #fff; background: #8e24aa; box-shadow: 0 3px 0 #4a148c; }
    #btn-chal-quit  { color: #6a1b9a; background: #f3e5f5; border: 2px solid #ce93d8; }
    @media (prefers-reduced-motion: reduce) { .chal-btn, .chal-btns button { transition: none; } }
    `;

    var BAR_HTML =
        '<button id="btn-challenge" class="chal-btn" type="button"></button>' +
        '<div id="chal-bar"><span id="chal-dots"></span><span id="chal-count"></span></div>';

    var RESULT_HTML =
        '<div class="chal-card">' +
        '  <div class="chal-title">🏁 <span id="chal-total-title"></span>問 できました！</div>' +
        '  <div class="chal-lines" id="chal-lines"></div>' +
        '  <div class="chal-btns">' +
        '    <button id="btn-chal-again" type="button">もう一度チャレンジ</button>' +
        '    <button id="btn-chal-quit" type="button">やめる</button>' +
        '  </div>' +
        '</div>';

    var cfg = null;
    var chal = { on: false, total: 10, no: 0, miss: 0, missNow: 0, perfect: 0, t0: 0 };
    var $ = function (id) { return document.getElementById(id); };

    // --- きょうの記録（localStorage。使えないときは だまって何もしない）---
    function todayKey() {
        var d = new Date();
        return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
    }
    function loadBest() {
        if (!cfg.record) return null;
        try {
            var raw = localStorage.getItem(cfg.recordKey);
            if (!raw) return null;
            var o = JSON.parse(raw);
            // その日の記録だけ／問題数がちがう記録はまぜない
            return (o && o.day === todayKey() && o.total === chal.total) ? o : null;
        } catch (e) { return null; }
    }
    function saveBest(perfect, sec) {
        if (!cfg.record) return null;
        var best = loadBest();
        // ノーミスの数が多いほうが上。同じなら 時間が短いほう
        if (best && (best.perfect > perfect || (best.perfect === perfect && best.sec <= sec))) return best;
        var o = { day: todayKey(), perfect: perfect, sec: sec, total: chal.total };
        try { localStorage.setItem(cfg.recordKey, JSON.stringify(o)); } catch (e) { }
        return o;
    }

    // --- 帯（○○○●…）の書きかえ ---
    function chalUpdateBar() {
        $('btn-challenge').classList.toggle('on', chal.on);
        $('chal-bar').style.display = chal.on ? 'flex' : 'none';
        if (!chal.on) return;
        var dots = '';
        for (var i = 0; i < chal.total; i++) dots += (i < chal.no) ? '●' : '○';
        $('chal-dots').innerText = dots;
        $('chal-count').innerText = Math.min(chal.no + 1, chal.total) + '問め / ' + chal.total;
    }

    // --- はじめから数えなおす ---
    function chalReset() {
        chal.no = 0; chal.miss = 0; chal.missNow = 0; chal.perfect = 0; chal.t0 = Date.now();
        $('chal-result').classList.remove('show');
        chalUpdateBar();
    }

    // --- 1問おわったときに呼ぶ ---
    function chalDone() {
        if (!chal.on) return;
        if (chal.missNow === 0) chal.perfect++;
        chal.no++;
        chalUpdateBar();
        if (chal.no < chal.total) {
            setTimeout(function () {         // つぎの問題へ
                if (!chal.on) return;
                chal.missNow = 0;
                if (cfg.next) cfg.next();
            }, cfg.nextDelay);
            return;
        }
        var sec = Math.floor((Date.now() - chal.t0) / 1000);
        var msg = (chal.perfect === chal.total) ? 'ぜんぶノーミス！ すばらしい！'
                : (chal.perfect >= chal.total - 2) ? 'よくがんばりました！'
                : 'つぎは もっとできる！';
        var best = saveBest(chal.perfect, sec);
        var result = { perfect: chal.perfect, miss: chal.miss, sec: sec, total: chal.total };
        setTimeout(function () {
            $('chal-total-title').innerText = chal.total;
            $('chal-lines').innerHTML =
                '<div>ノーミスでできた問題　<b>' + chal.perfect + '</b> / ' + chal.total + '</div>' +
                '<div>まちがえた回数　<b>' + chal.miss + '</b> 回</div>' +
                '<div>かかった時間　<b>' + Math.floor(sec / 60) + '</b> 分 <b>' + (sec % 60) + '</b> 秒</div>' +
                '<div class="chal-msg">' + msg + '</div>' +
                (best ? '<div class="chal-best">きょうの最高記録　ノーミス ' + best.perfect + ' / ' + best.total +
                        ' 問　　' + Math.floor(best.sec / 60) + '分' + (best.sec % 60) + '秒</div>' : '');
            $('chal-result').classList.add('show');
            $('btn-chal-again').focus();
            if (cfg.onFinish) cfg.onFinish(result);
        }, cfg.resultDelay);
    }

    // --- はじめの用意 ---
    function init(opt) {
        opt = opt || {};
        cfg = {
            total: opt.total || 10,
            next: opt.next || null,
            nextDelay: (opt.nextDelay === undefined) ? 1800 : opt.nextDelay,
            resultDelay: (opt.resultDelay === undefined) ? 1500 : opt.resultDelay,
            label: opt.label || '🏁 10問チャレンジ',
            sound: opt.sound || null,
            onToggle: opt.onToggle || null,
            onFinish: opt.onFinish || null,
            record: !!opt.record,
            recordKey: opt.recordKey || 'challenge10',
            css: (opt.css === undefined) ? true : opt.css
        };
        chal.total = cfg.total;
        if (opt.label === undefined && cfg.total !== 10) cfg.label = '🏁 ' + cfg.total + '問チャレンジ';

        // CSS
        if (cfg.css && !$('chal-style')) {
            var st = document.createElement('style');
            st.id = 'chal-style';
            st.textContent = CSS;
            document.head.appendChild(st);
        }
        // ボタンと帯
        var host = (typeof opt.mount === 'string') ? document.querySelector(opt.mount) : opt.mount;
        var wrap = $('chal-wrap');
        if (!wrap) {
            wrap = document.createElement('div');
            wrap.id = 'chal-wrap';
            wrap.innerHTML = BAR_HTML;
            if (host) host.appendChild(wrap);
            else document.body.insertBefore(wrap, document.body.firstChild);
        }
        // 成せき表
        if (!$('chal-result')) {
            var res = document.createElement('div');
            res.id = 'chal-result';
            res.innerHTML = RESULT_HTML;
            document.body.appendChild(res);
        }
        $('btn-challenge').innerText = cfg.label;

        $('btn-challenge').addEventListener('click', function () {
            chal.on = !chal.on;
            if (cfg.sound) cfg.sound();
            chalReset();
            if (cfg.onToggle) cfg.onToggle(chal.on);
            if (cfg.next) cfg.next();
        });
        $('btn-chal-again').addEventListener('click', function () {
            chalReset();
            if (cfg.next) cfg.next();
        });
        $('btn-chal-quit').addEventListener('click', function () {
            chal.on = false;
            chalReset();
            if (cfg.onToggle) cfg.onToggle(false);
            if (cfg.next) cfg.next();
        });

        chalUpdateBar();
        return API;
    }

    var API = {
        init: init,
        done: chalDone,                                        // 1問できた
        miss: function () { if (chal.on) { chal.miss++; chal.missNow++; } },  // まちがえた
        newProblem: function () { chal.missNow = 0; },          // 新しい問題を出した
        reset: chalReset,                                       // 数えなおす
        stop: function () { chal.on = false; chalReset(); },    // やめる
        isOn: function () { return chal.on; },
        updateBar: chalUpdateBar,
        setTotal: function (n) { chal.total = cfg.total = n; chalReset(); },
        state: chal
    };

    global.Challenge10 = API;
    if (typeof module !== 'undefined' && module.exports) module.exports = API;
})(typeof window !== 'undefined' ? window : this);
</script>

    pred:v=>`${v}円です`, ask:'何円ですか。' },
  { a:'子どものねこ', b:'親のねこ', attr:'重さ', unit:'g', scale:100,
    pred:v=>`重さが${v}gです`, ask:'重さは何gですか。' }
];

const MODES = {
  times:   { name:'何倍',      color:'#2E6FB7' },
  compare: { name:'比べる数',  color:'#128C7E' },
  base:    { name:'元にする数', color:'#C2681A' },
  random:  { name:'ランダム',  color:'#2E6FB7' },
  versus:  { name:'くらべる',  color:'#B0397A' }
};

/* くらべる用の場面 */
const VS_CONTEXTS = [
  { a:'ゴムA', b:'ゴムB', pre:'のばす前', post:'のばした後', attr:'長さ', unit:'cm', verb:'よくのびる' },
  { a:'ばねA', b:'ばねB', pre:'おもりをつるす前', post:'つるした後', attr:'長さ', unit:'cm', verb:'よくのびる' },
  { a:'赤いふうせん', b:'青いふうせん', pre:'ふくらませる前', post:'ふくらませた後', attr:'高さ', unit:'cm', verb:'大きくふくらむ' },
  { a:'なえA', b:'なえB', pre:'先週', post:'今週', attr:'高さ', unit:'cm', verb:'よくのびた' }
];
let V = null;

/* ============================================================
   📝 テストの練習（TestRun）との 橋わたし
   このアプリには setMode / showHanamaru / applyJudge が無いので ここで用意する。
   「②しくみ」は1行もさわらない（外からこの3つを包む作りのため）。
   ============================================================ */
var mode = 'times';                                  /* いま開いている小タブ（TestRunが見る） */
const HANAMARU_SHOW_MS = 1500, AUTO_NEXT_MS = 800;   /* 正解から次の大問までの待ち時間 */
Object.keys(MODES).forEach(k => MODES[k].label = MODES[k].name);   /* 結果の表に出す名前 */
function showHanamaru(){}            /* 1もんだいが正解でおわった合図（TestRunが外から包む） */
function applyJudge(r){}             /* まるつけの結果の合図（同上） */
function judgeNg(){ Challenge10.miss(); applyJudge({ok:false}); }   /* まちがえた */


const rnd = n => Math.floor(Math.random()*n);
const pick = arr => arr[rnd(arr.length)];

let tab = 'times';
let Q = null;
let tokens = [];
let solved = false;
let okCount = 0, allCount = 0;

/* □をつかった式モード（何倍・元にする数のもんだいだけ。ランダムの中でも切りかわる） */
let useBox  = false;
let boxStep = 1;              // ① □の式をつくる  ② □をわり算でもとめる
let revealed = new Set();     // 「図の表示をかくす」で、クリックして出した部品
/* 1つのもんだいで「1問おわり」を2回数えないようにする見はり役
   （□の式は2ステップ、くらべるは3ステップあるので、最後の1回だけ数える） */
let chalCounted = false;
let qSerial = 0;              // もんだいの通し番号（古いタイマーが新しい問題をさわらないように）
function problemDone(){
  if (chalCounted) return;
  chalCounted = true;
  Challenge10.done();         /* 10問チャレンジ：1問すすむ */
  showHanamaru();             /* テストの練習：次の大問へ */
}
/* くらべるタブは1もんだい＝3ステップなので5問にする */
function chalTotalFor(t){ return t === 'versus' ? 5 : 10; }
/* せまい画面ではボタンの文字を短く（ヘッダーが切れないように） */
function chalLabel(n){ return '🏁 ' + n + '問' + (window.innerWidth < 700 ? '' : 'チャレンジ'); }
function syncChalTotal(){
  const n = chalTotalFor(tab);
  if (Challenge10.state.total !== n){
    Challenge10.setTotal(n);                                   /* 中で reset もされる */
    document.getElementById('btn-challenge').innerText = chalLabel(n);
  } else {
    Challenge10.reset();                                       /* タブを変えたら数えなおす */
  }
}

/* 小タブを開く。タブのボタンからも、テストの練習からも ここを通る */
function setMode(m){
  if (!MODES[m]) return;
  document.querySelectorAll('.tab').forEach(b =>
    b.setAttribute('aria-selected', b.dataset.mode === m ? 'true' : 'false'));
  tab = m; mode = m;
  const fb = document.getElementById('feedback');
  fb.textContent = ''; fb.className = '';
  syncChalTotal();
  makeQuestion();
  applyTestUI(m);
}

/* テスト中だけ、大問の set:{box:true} / set:{hide:true} を 2つのチェックに反映する。
   テストがおわったら、始める前のチェックにもどす */
let uiBase = null;
function applyTestUI(m){
  const testing = document.body.classList.contains('testing');
  const cb = document.getElementById('usebox'), ch = document.getElementById('hidefig');
  if (testing && !uiBase) uiBase = { box: cb.checked, hide: ch.checked };
  const md = MODES[m] || {};
  const want = testing ? { box: !!md.box, hide: !!md.hide }
                       : (uiBase || { box: cb.checked, hide: ch.checked });
  if (!testing) uiBase = null;
  [[cb, want.box], [ch, want.hide]].forEach(pair => {
    if (pair[0].checked !== pair[1]){ pair[0].checked = pair[1]; pair[0].dispatchEvent(new Event('change')); }
  });
}

function boxTabOK(){
  const m = (tab === 'random') ? (Q && Q.mode) : tab;
  return m === 'times' || m === 'base';
}
function boxOn(){ return useBox && boxTabOK(); }

/* ============================================================
   もんだいをつくる
   ============================================================ */
function makeQuestion(){
  Challenge10.newProblem();          /* この問題のミス数を0に */
  chalCounted = false;
  qSerial++;                         /* 前の問題のタイマーを効かなくする */
  if (tab === 'versus'){ makeVs(); return; }
  const mode = (tab === 'random') ? pick(['times','compare','base']) : tab;
  const ctx  = pick(CONTEXTS);
  const n    = 2 + rnd(8);
  let k;
  do { k = 2 + rnd(11); } while (k * n > 96);
  const base = k * ctx.scale;
  const comp = base * n;

  let text;
  if (mode === 'times'){
    text = `${ctx.a}は${ctx.pred(base)}。${ctx.b}は${ctx.pred(comp)}。`
         + `<span class="ask">${ctx.b}の${ctx.attr}は、${ctx.a}の${ctx.attr}の何倍ですか。</span>`;
  } else if (mode === 'compare'){
    text = `${ctx.a}は${ctx.pred(base)}。${ctx.b}の${ctx.attr}は、${ctx.a}の${ctx.attr}の${n}倍です。`
         + `<span class="ask">${ctx.b}は${ctx.ask}</span>`;
  } else {
    text = `${ctx.b}は${ctx.pred(comp)}。これは、${ctx.a}の${ctx.attr}の${n}倍です。`
         + `<span class="ask">${ctx.a}は${ctx.ask}</span>`;
  }

  const expect =
      mode === 'times'   ? {x:comp, op:'÷', y:base, ans:n,    label:`${n}倍`}
    : mode === 'compare' ? {x:base, op:'×', y:n,    ans:comp, label:`${comp}${ctx.unit}`}
    :                      {x:comp, op:'÷', y:n,    ans:base, label:`${base}${ctx.unit}`};

  Q = { mode, ctx, n, base, comp, text, expect };
  solved = false;
  boxStep = 1;
  revealed.clear();
  tokens = [];
  render();
}

/* ============================================================
   線分図
   ============================================================ */
function wrap(s, max){
  const out = [];
  for (let i=0; i<s.length; i+=max) out.push(s.slice(i, i+max));
  return out;
}
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
/* 文字のおおよその幅（全角＝1、半角＝0.6） */
function tw(s){ return [...s].reduce((a,c)=> a + (c.charCodeAt(0) > 255 ? 1 : 0.6), 0); }

function hideOn(){ return document.getElementById('hidefig').checked; }

/* かくせる部品。かくしているときは青い□。クリックで出し入れする
   size を渡すと、その大きさにそろえる（中身が推測できないように） */
function hid(key, part, size){
  if (!hideOn()) return part.svg;
  const b = part.box;
  const w = Math.max(size ? size.w : b.w, 48), h = Math.max(size ? size.h : b.h, 42);
  const cy = b.y + b.h/2;
  const rawX = (part.anchor === 'right') ? (b.x + b.w - w) : (b.x + b.w/2 - w/2);
  const x = Math.min(Math.max(rawX, 2), 778 - w);   // 図の枠からはみ出さないように
  const y = Math.min(Math.max(cy - h/2, 2), 370 - h);
  const tap = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8"`;
  return revealed.has(key)
    ? `<g class="hit" data-k="${key}">${tap} fill="transparent" pointer-events="all"/>${part.svg}</g>`
    : `<g class="hit" data-k="${key}">${tap} fill="#CFE0F1" stroke="#3C7CB5" stroke-width="2.5"/></g>`;
}

/* 帯の名前（長いときは折り返す） */
function labelPart(name, yc){
  const lines = wrap(name, 8), L = lines.length;
  let g = '';
  lines.forEach((t,i)=> g += `<text x="182" y="${yc + 12 + i*26 - (L-1)*13}" text-anchor="end" font-size="21" fill="#1F3A5F">${esc(t)}</text>`);
  const w = Math.max(...lines.map(tw))*21 + 10;
  return {svg:g, anchor:'right', box:{x:182-w, y:yc + 12 - (L-1)*13 - 19, w, h:(L-1)*26 + 26}};
}

function drawFigure(){
  const {mode, ctx, n, base, comp} = Q;
  const W = 780, H = 372;
  const x0 = 196, x1 = 688, uw = (x1 - x0) / n;
  const yT = 100, yB = 226, bh = 42, yL = 306;
  const unknownTop  = (mode === 'compare' && !solved);
  const unknownBase = (mode === 'base'    && !solved);
  const unknownN    = (mode === 'times'   && !solved);
  const u = ctx.unit;
  let s = '';

  /* かくしたときに中身が推測できないよう、名前どうし・数値どうしは同じ大きさの枠にする */
  const pTop  = labelPart(ctx.b, yT), pBase = labelPart(ctx.a, yB);
  const labSize = {w:Math.max(pTop.box.w, pBase.box.w), h:Math.max(pTop.box.h, pBase.box.h)};
  const vTop  = valueTag((x0+x1)/2, yT-bh/2-46, comp + u, unknownTop,  30, u);
  const vBase = valueTag(x0+uw/2,   yB-bh/2-36, base + u, unknownBase, 28, u);
  const valSize = {w:Math.max(vTop.box.w, vBase.box.w), h:Math.max(vTop.box.h, vBase.box.h)};

  s += hid('labTop',  pTop,  labSize);
  s += hid('labBase', pBase, labSize);

  s += `<rect x="${x0}" y="${yT-bh/2}" width="${x1-x0}" height="${bh}" fill="var(--bar-top)" stroke="var(--bar-top-edge)" stroke-width="2.5" rx="2"/>`;
  for (let i=1;i<n;i++){
    const x = x0 + uw*i;
    s += `<line x1="${x}" y1="${yT-bh/2}" x2="${x}" y2="${yT+bh/2}" stroke="var(--bar-top-edge)" stroke-width="1.6" stroke-dasharray="5 4"/>`;
  }
  s += `<rect x="${x0}" y="${yB-bh/2}" width="${uw}" height="${bh}" fill="var(--bar-base)" stroke="var(--bar-base-edge)" stroke-width="2.5" rx="2"/>`;

  [x0, x0+uw, x1].forEach(x => s += `<line x1="${x}" y1="${yT-bh/2-6}" x2="${x}" y2="${yL-14}" stroke="#9FB3C8" stroke-width="1.4" stroke-dasharray="5 5"/>`);

  s += `<path d="M ${x0} ${yT-bh/2-14} Q ${(x0+x1)/2} ${yT-bh/2-52} ${x1} ${yT-bh/2-14}" fill="none" stroke="#7E93A8" stroke-width="1.8" stroke-dasharray="7 6"/>`;
  s += hid('valTop', vTop, valSize);

  s += `<path d="M ${x0} ${yB-bh/2-12} Q ${x0+uw/2} ${yB-bh/2-40} ${x0+uw} ${yB-bh/2-12}" fill="none" stroke="#7E93A8" stroke-width="1.8" stroke-dasharray="7 6"/>`;
  s += hid('valBase', vBase, valSize);

  s += `<line x1="${x0-30}" y1="${yL}" x2="${x1+20}" y2="${yL}" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>`;
  for (let i=0;i<=n;i++){
    const x = x0 + uw*i;
    s += `<line x1="${x}" y1="${yL-11}" x2="${x}" y2="${yL+11}" stroke="var(--line)" stroke-width="3.4"/>`;
  }
  s += `<text x="${x0}" y="${yL+42}" text-anchor="middle" font-size="27" font-weight="800" fill="#1F3A5F">0</text>`;
  s += `<text x="${x0+uw}" y="${yL+42}" text-anchor="middle" font-size="27" font-weight="800" fill="#1F3A5F">1</text>`;
  s += hid('valN', valueTag(x1, yL+34, String(n), unknownN, 28));
  s += `<text x="${x1+26}" y="${yL+42}" text-anchor="start" font-size="26" font-weight="700" fill="#1F3A5F">倍</text>`;

  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="線分図">${s}</svg>`;
}

/* いま□になっている場所 */
function unknownKey(){
  return Q.mode === 'compare' ? 'valTop' : Q.mode === 'base' ? 'valBase' : 'valN';
}
function paintFig(){ document.getElementById('figure').innerHTML = drawFigure(); }

function valueTag(cx, cy, text, unknown, size, unit){
  if (unknown){
    const bw = 40, uw = unit ? tw(unit)*size : 0;
    const total = bw + (unit ? 5 + uw : 0);
    const x = cx - total/2;
    let g = `<rect x="${x}" y="${cy-24}" width="${bw}" height="40" rx="5" fill="#fff" stroke="var(--line)" stroke-width="3"/>`;
    if (unit) g += `<text x="${x+bw+5}" y="${cy}" font-size="${size}" font-weight="800" fill="#1F3A5F">${esc(unit)}</text>`;
    return {svg:`<g>${g}</g>`, box:{x:x-5, y:cy-29, w:total+10, h:50}};
  }
  text = String(text);
  const w = tw(text)*size + 14;
  return {
    svg: `<g><rect x="${cx-w/2}" y="${cy-size-4}" width="${w}" height="${size+12}" rx="7" fill="#fff" opacity=".92"/>`
       + `<text x="${cx}" y="${cy}" text-anchor="middle" font-size="${size}" font-weight="800" fill="#1F3A5F">${esc(text)}</text></g>`,
    box: {x:cx-w/2, y:cy-size-4, w, h:size+12}
  };
}

/* ============================================================
   式（電卓）
   ============================================================ */
const OPS = ['＋','−','×','÷'];
function press(k){
  if (k === 'C'){ tokens = []; clearJudge(); return render(); }
  if (k === '□'){
    if (!boxOn() || boxStep !== 1) return;
    if (tokens.some(t => t.t === 'box')) return;          // □は1つだけ
    const lastB = tokens[tokens.length-1];
    if (lastB && (lastB.t === 'num' || lastB.t === 'box')) return;
    tokens.push({t:'box'});
    clearJudge(); return render();
  }
  if (k === 'back'){
    if (!tokens.length) return;
    const last = tokens[tokens.length-1];
    if (last.t === 'eq' || last.t === 'op' || last.t === 'box') tokens.pop();
    else { last.v = last.v.slice(0,-1); if (!last.v) tokens.pop(); }
    clearJudge(); return render();
  }
  if (OPS.includes(k)){
    if (!tokens.length) return;
    const last = tokens[tokens.length-1];
    if (last.t === 'eq') return;
    if (boxOn() && tokens.length >= 2 && last.t !== 'op') return;   // 2つの数までにする
    if (last.t === 'op'){ last.v = k; } else { tokens.push({t:'op', v:k}); }
    clearJudge(); return render();
  }
  const last = tokens[tokens.length-1];
  if (last && last.t === 'box') return;      // □のあとは、まず＋−×÷
  if (last && last.t === 'num'){
    if (last.v.length >= 4) return;
    if (last.v === '0') last.v = k; else last.v += k;
  } else {
    tokens.push({t:'num', v:k});
  }
  clearJudge(); render();
}

function parse(){
  const t = tokens;
  if (t.length < 3) return null;
  if (t[0].t !== 'num' || t[1].t !== 'op' || t[2].t !== 'num') return null;
  const x = +t[0].v, y = +t[2].v, op = t[1].v;
  if (op === '÷' && y === 0) return null;
  const result = op === '＋' ? x+y : op === '−' ? x-y : op === '×' ? x*y : x/y;
  return {x, op, y, result: Math.round(result*1000)/1000};
}

function exprText(){
  return tokens.map(t => t.t === 'eq' ? ' = ' : t.t === 'op' ? ` ${t.v} ` : t.v).join('');
}

/* ---- □をつかった式 ---- */
function exprHTML(){
  return tokens.map(t =>
    t.t === 'eq'  ? ' = ' :
    t.t === 'op'  ? ` ${t.v} ` :
    t.t === 'box' ? '<span class="bx">□</span>' : esc(t.v)).join('');
}
/* いま入力されている「数（か□） 演算子 数（か□）」を取り出す */
function terms(){
  if (tokens.length < 3) return null;
  const a = tokens[0], o = tokens[1], b = tokens[2];
  if (o.t !== 'op') return null;
  const T = x => x.t === 'box' ? {box:true} : x.t === 'num' ? {num:+x.v} : null;
  const A = T(a), B = T(b);
  if (!A || !B) return null;
  return {A, op:o.v, B};
}
/* ①でつくる正しい式（もとにする数 × 何倍 ＝ くらべる数） */
function boxEqHTML(){
  const b = '<span class="bx">□</span>', K = Q.expect.y;
  return (Q.mode === 'times' ? `${K} × ${b}` : `${b} × ${K}`) + ` = ${Q.comp}`;
}
function boxDisplayHTML(){
  if (boxStep === 1){
    const left = tokens.length ? exprHTML() : '<span class="ph gap">ここに式を</span>';
    return `${left} <span class="given">= ${Q.comp}</span>`;
  }
  return `<span class="bx">□</span><span class="given"> = </span>${exprHTML()}`;
}

/* ============================================================
   まるつけ
   ============================================================ */
function check(){
  if (tab === 'versus'){ checkVs(); return; }
  if (boxOn()){ checkBox(); return; }
  const fb = document.getElementById('feedback');
  const p = parse();
  if (!p){
    fb.className = 'ng';
    fb.textContent = '式がまだできていないよ。「数 → ＋−×÷ → 数」の順にキーをおそう。';
    return;
  }
  if (solved){ showStamp('maru'); return; }

  const e = Q.expect;
  const orderSwapped = (Q.mode === 'compare' && p.op === '×' && p.x === e.y && p.y === e.x && e.x !== e.y);
  const correct = (p.op === e.op && p.x === e.x && p.y === e.y) || orderSwapped;

  allCount++;
  if (correct){
    okCount++; solved = true;
    revealed.add(unknownKey());      /* 正解したら図の□も見えるようにする */
    showStamp('maru');
    problemDone();
    fb.className = 'ok';
    fb.innerHTML = orderSwapped
      ? '◎ せいかい！　ただし式は<b>（もとにする数）×（何倍）</b>の順で書くと意味がはっきりするよ。'
      : '◎ せいかい！　線分図とぴったり合っているね。';
    const ansBox = document.getElementById('answer');
    ansBox.className = 'answer filled pop';
    ansBox.textContent = e.label;
    if (!tokens.some(t=>t.t==='eq')) tokens.push({t:'eq'}, {t:'num', v:String(p.result)});
  } else {
    showStamp('batsu');
    judgeNg();
    fb.className = 'ng';
    fb.innerHTML = '△ もういちど。' + diagnose(p, e);
  }
  updateScore();
  render();
}

let stampTimer = null;
function showStamp(kind){
  const el = document.getElementById('stamp');
  el.className = '';
  void el.offsetWidth;                 // アニメーションを最初から
  el.classList.add('show', kind);
  clearTimeout(stampTimer);
  stampTimer = setTimeout(()=>{ el.className = ''; }, 1500);
  if (kind === 'maru'){
    const se = document.getElementById('se-ok');
    try { se.currentTime = 0; const pr = se.play(); if (pr) pr.catch(()=>{}); } catch(err){}
  }
}

function diagnose(p, e){
  if (p.op === '＋' || p.op === '−')
    return 'たし算・ひき算ではもとめられないよ。<b>1つ分</b>がいくつあるかを考えよう。';
  if (p.op !== e.op)
    return e.op === '÷'
      ? 'わからない数は<b>わり算</b>でもとめられそうだよ。'
      : 'もとにする数を<b>何倍</b>かするから、<b>かけ算</b>だよ。';
  if (p.op === '÷' && p.x === e.y && p.y === e.x)
    return 'わられる数とわる数が反対かも。<b>大きい数 ÷ 小さい数</b>の形をたしかめよう。';
  return '線分図の数と、式の数がちがうところがあるよ。もう一度ながめてみよう。';
}

/* ============================================================
   □をつかった式のまるつけ
   ============================================================ */
function checkBox(){
  const fb = document.getElementById('feedback');
  const t  = terms();
  const e  = Q.expect, K = e.y;              // K＝わかっているほうの数

  /* ---- ① □をつかったかけ算の式をつくる ---- */
  if (boxStep === 1){
    if (!t){
      fb.className = 'ng';
      fb.textContent = '式がまだできていないよ。「数 → × → □」のようにキーをおそう。';
      return;
    }
    const boxFirst = (Q.mode === 'base');    // 元にする数タブは □ が先
    const canon   = t.op === '×' && (boxFirst ? (t.A.box && t.B.num === K) : (t.A.num === K && t.B.box));
    const swapped = t.op === '×' && (boxFirst ? (t.B.box && t.A.num === K) : (t.B.num === K && t.A.box));
    if (swapped){                       /* ◯にはしない。順番をなおしてもらう */
      showStamp('swap');
      applyJudge({ok:false, skip:true});   /* ⇄ はまちがいに数えない */
      fb.className = 'ng';
      fb.innerHTML = 'おしい！　<b>（もとにする数）×（何倍）＝（くらべる数）</b>の順に書こう。'
                   + (boxFirst ? 'このもんだいで、もとにする数は<b>□</b>のほうだね。'
                               : `このもんだいで、もとにする数は<b>${K}</b>だね。`);
      return;
    }
    allCount++;
    if (canon){
      okCount++;
      showStamp('maru');
      fb.className = 'ok';
      fb.innerHTML = '◎ せいかい！　この□を、つぎはわり算でもとめよう。';
      updateScore();
      const sn = qSerial;
      setTimeout(()=>{
        if (sn !== qSerial || !boxOn() || boxStep !== 1) return;
        boxStep = 2; tokens = [];
        fb.textContent = ''; fb.className = '';
        render();
      }, 1500);
      return;
    }
    showStamp('batsu');
    judgeNg();
    fb.className = 'ng';
    fb.innerHTML = '△ もういちど。' + diagnoseBox(t, boxFirst);
    updateScore();
    return;
  }

  /* ---- ② □をわり算でもとめる ---- */
  if (solved){ showStamp('maru'); return; }
  if (!t || t.A.box || t.B.box){
    fb.className = 'ng';
    fb.textContent = '式がまだできていないよ。「数 → ÷ → 数」の順にキーをおそう。';
    return;
  }
  allCount++;
  if (t.op === '÷' && t.A.num === e.x && t.B.num === e.y){
    okCount++; solved = true;
    revealed.add(unknownKey());
    showStamp('maru');
    problemDone();
    fb.className = 'ok';
    fb.innerHTML = `◎ せいかい！　□にあてはまる数は<b>${e.ans}</b>だね。`;
    if (!tokens.some(x => x.t === 'eq')) tokens.push({t:'eq'}, {t:'num', v:String(e.ans)});
    const a = document.getElementById('answer');
    a.className = 'answer filled pop';
    a.textContent = e.label;
    updateScore(); render();
    return;
  }
  showStamp('batsu');
  judgeNg();
  fb.className = 'ng';
  fb.innerHTML = '△ もういちど。' + diagnose({x:t.A.num, op:t.op, y:t.B.num}, e);
  updateScore();
}

function diagnoseBox(t, boxFirst){
  if (!t.A.box && !t.B.box)
    return '<b>□</b>のキーをつかって、わからない数を□であらわそう。';
  if (t.op === '＋' || t.op === '−')
    return 'たし算・ひき算ではなく、<b>（もとにする数）×（何倍）</b>のかけ算であらわそう。';
  if (t.op === '÷')
    return 'まずは<b>かけ算</b>の式であらわそう。わり算はそのつぎだよ。';
  return `□といっしょにかける数がちがうみたい。線分図の<b>${boxFirst ? '倍の数' : 'もとにする数'}</b>をたしかめよう。`;
}

function clearJudge(){

  document.getElementById('sc-ok').textContent = okCount;

}

/* ============================================================
   くらべる（２つの倍をくらべる）
   ============================================================ */
function makeVs(){
  const c = pick(VS_CONTEXTS);
  let nA = 2 + rnd(5), nB = 2 + rnd(5);
  while (nB === nA) nB = 2 + rnd(5);
  const bA = 2 + rnd(11), bB = 2 + rnd(11);
  V = { c,
        A:{ n:nA, base:bA, after:bA*nA, done:false },
        B:{ n:nB, base:bB, after:bB*nB, done:false },
        step:1, done3:false };
  tokens = [];
  renderVs();
}

function vsTag(cx, cy, text, unknown, size){
  if (unknown)
    return `<rect x="${cx-19}" y="${cy-23}" width="38" height="38" rx="5" fill="#fff" stroke="#D0347A" stroke-width="3"/>`;
  const w = text.length * size * 0.62 + 12;
  return `<rect x="${cx-w/2}" y="${cy-size-3}" width="${w}" height="${size+10}" rx="6" fill="#fff" opacity=".92"/>`
       + `<text x="${cx}" y="${cy}" text-anchor="middle" font-size="${size}" font-weight="800" fill="#1F3A5F">${esc(text)}</text>`;
}

function drawVsFig(k){
  const c = V.c, o = V[k], u = c.unit;
  const W = 780, H = 260;
  const x0 = 186, x1 = 690, uw = (x1 - x0) / o.n;
  const yT = 66, yB = 158, bh = 32, yL = 212;
  let s = '';

  s += `<text x="174" y="${yT+7}" text-anchor="end" font-size="20" fill="#1F3A5F">${esc(c.post)}</text>`;
  s += `<text x="174" y="${yB+7}" text-anchor="end" font-size="20" fill="#1F3A5F">${esc(c.pre)}</text>`;

  s += `<rect x="${x0}" y="${yT-bh/2}" width="${x1-x0}" height="${bh}" fill="var(--bar-top)" stroke="var(--bar-top-edge)" stroke-width="2.2" rx="2"/>`;
  for (let i=1;i<o.n;i++){
    const x = x0 + uw*i;
    s += `<line x1="${x}" y1="${yT-bh/2}" x2="${x}" y2="${yT+bh/2}" stroke="var(--bar-top-edge)" stroke-width="1.4" stroke-dasharray="4 4"/>`;
  }
  s += `<rect x="${x0}" y="${yB-bh/2}" width="${uw}" height="${bh}" fill="var(--bar-base)" stroke="var(--bar-base-edge)" stroke-width="2.2" rx="2"/>`;

  [x0, x0+uw, x1].forEach(x => s += `<line x1="${x}" y1="${yT-bh/2-6}" x2="${x}" y2="${yL-12}" stroke="#9FB3C8" stroke-width="1.2" stroke-dasharray="4 4"/>`);

  s += `<path d="M ${x0} ${yT-bh/2-10} Q ${(x0+x1)/2} ${yT-bh/2-34} ${x1} ${yT-bh/2-10}" fill="none" stroke="#7E93A8" stroke-width="1.6" stroke-dasharray="6 5"/>`;
  s += vsTag((x0+x1)/2, yT-bh/2-26, `${o.after}${u}`, false, 26);

  s += `<path d="M ${x0} ${yB-bh/2-10} Q ${x0+uw/2} ${yB-bh/2-32} ${x0+uw} ${yB-bh/2-10}" fill="none" stroke="#7E93A8" stroke-width="1.6" stroke-dasharray="6 5"/>`;
  s += vsTag(x0+uw/2, yB-bh/2-26, `${o.base}${u}`, false, 24);

  s += `<line x1="${x0-26}" y1="${yL}" x2="${x1+18}" y2="${yL}" stroke="var(--line)" stroke-width="3.6" stroke-linecap="round"/>`;
  for (let i=0;i<=o.n;i++){
    const x = x0 + uw*i;
    s += `<line x1="${x}" y1="${yL-9}" x2="${x}" y2="${yL+9}" stroke="var(--line)" stroke-width="3"/>`;
  }
  s += `<text x="${x0}" y="${yL+34}" text-anchor="middle" font-size="24" font-weight="800" fill="#1F3A5F">0</text>`;
  s += `<text x="${x0+uw}" y="${yL+34}" text-anchor="middle" font-size="24" font-weight="800" fill="#1F3A5F">1</text>`;
  s += vsTag(x1, yL+28, String(o.n), !o.done, 24);
  s += `<text x="${x1+24}" y="${yL+34}" text-anchor="start" font-size="23" font-weight="700" fill="#1F3A5F">倍</text>`;

  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="線分図">${s}</svg>`;
}

function paintVsFig(k){ document.getElementById('vsfig'+k).innerHTML = drawVsFig(k); }

function renderVs(){
  const c = V.c, u = c.unit;
  document.documentElement.style.setProperty('--mode', MODES.versus.color);
  document.getElementById('cap').textContent = 'もんだい ／ くらべる';
  document.getElementById('figure').style.display = 'none';
  document.getElementById('figopts').style.display = 'none';
  document.getElementById('boxbar').className = '';
  const kcv = document.getElementById('key-clear');
  kcv.dataset.k = 'C'; kcv.textContent = 'C'; kcv.className = 'key util';
  document.getElementById('vs').classList.add('show');
  document.getElementById('steps').classList.add('show');

  const q = [
    `${c.a}の${c.post}の${c.attr}は、${c.pre}の${c.attr}の何倍ですか。`,
    `${c.b}の${c.post}の${c.attr}は、${c.pre}の${c.attr}の何倍ですか。`,
    `倍どうしをくらべると、${c.a}と${c.b}では、どちらが${c.verb}といえますか。`
  ][V.step-1];
  const base = `${c.a}と${c.b}があります。`
             + `${c.a}は${c.pre}が${V.A.base}${u}、${c.post}が${V.A.after}${u}。`
             + `${c.b}は${c.pre}が${V.B.base}${u}、${c.post}が${V.B.after}${u}です。`;
  document.getElementById('question').innerHTML =
    (base + `<span class="ask">${['①','②','③'][V.step-1]}${q}</span>`)
      .replace(/(\d+)(cm|mL|g|回|円|m|倍)/g, '<span class="num">$1$2</span>');

  document.getElementById('vstagA').textContent = c.a;
  document.getElementById('vstagB').textContent = c.b;
  paintVsFig('A'); paintVsFig('B');
  const bA = document.getElementById('vsA'), bB = document.getElementById('vsB');
  bA.className = 'vs-block' + (V.step===1 ? ' active' : V.step===2 ? ' dim' : '');
  bB.className = 'vs-block' + (V.step===2 ? ' active' : V.step===1 ? ' dim' : '');

  ['1','2','3'].forEach((n,i)=>{
    const el = document.getElementById('st'+n);
    el.className = 'step' + (V.step===i+1 ? ' now' : (V.step>i+1 ? ' done' : ''));
  });
  document.getElementById('st1').textContent = '① ' + c.a;
  document.getElementById('st2').textContent = '② ' + c.b;
  document.getElementById('st3').textContent = '③ くらべる';

  const pad = document.querySelector('.pad'), ch = document.getElementById('choice');
  const d = document.getElementById('display');
  if (V.step === 3){
    pad.classList.add('hide'); ch.classList.add('show');
    d.classList.add('summary');
    d.innerHTML = `${esc(c.a)} <b>${V.A.n}倍</b>　／　${esc(c.b)} <b>${V.B.n}倍</b>`;
    document.getElementById('ch-A').innerHTML = `${esc(c.a)}<small>${V.A.n}倍</small>`;
    document.getElementById('ch-B').innerHTML = `${esc(c.b)}<small>${V.B.n}倍</small>`;
  } else {
    pad.classList.remove('hide'); ch.classList.remove('show');
    d.classList.remove('summary');
    d.innerHTML = tokens.length ? esc(exprText()) : '<span class="ph">キーをおして式をつくろう</span>';
  }
  d.scrollLeft = d.scrollWidth;

  const a = document.getElementById('answer');
  if (!V.done3){
    a.className = 'answer';
    a.innerHTML = '<span class="ph">まるつけをするとでます</span>';
  }
}

function checkVs(){
  const fb = document.getElementById('feedback');
  if (V.step === 3){
    fb.className = 'ng';
    fb.textContent = '下の２つのボタンから、どちらかをえらぼう。';
    return;
  }
  const k = V.step === 1 ? 'A' : 'B';
  const o = V[k], name = V.step === 1 ? V.c.a : V.c.b;
  if (o.done){ showStamp('maru'); return; }

  const p = parse();
  if (!p){
    fb.className = 'ng';
    fb.textContent = '式がまだできていないよ。「数 → ÷ → 数」の順にキーをおそう。';
    return;
  }
  allCount++;
  if (p.op === '÷' && p.x === o.after && p.y === o.base){
    okCount++; o.done = true;
    showStamp('maru');
    fb.className = 'ok';
    fb.innerHTML = `◎ せいかい！　${esc(name)}は<b>${o.n}倍</b>にのびたね。`;
    if (!tokens.some(t=>t.t==='eq')) tokens.push({t:'eq'}, {t:'num', v:String(p.result)});
    document.getElementById('display').innerHTML = esc(exprText());
    const a = document.getElementById('answer');
    a.className = 'answer filled pop'; a.textContent = `${o.n}倍`;
    paintVsFig(k);
    updateScore();
    const sn = qSerial;
    setTimeout(()=>{ if (sn === qSerial && tab === 'versus' && V){ V.step++; tokens = []; fb.textContent=''; fb.className=''; renderVs(); } }, 1700);
    return;
  }
  showStamp('batsu');
  judgeNg();
  fb.className = 'ng';
  fb.innerHTML = '△ もういちど。' + diagnose(p, {op:'÷', x:o.after, y:o.base});
  updateScore();
}

function pickSide(k){
  if (tab !== 'versus' || V.step !== 3 || V.done3) return;
  const win = V.A.n > V.B.n ? 'A' : 'B';
  const fb = document.getElementById('feedback');
  const a = document.getElementById('answer');
  allCount++;
  if (k === win){
    okCount++; V.done3 = true;
    showStamp('maru');
    problemDone();                  /* ここで「1もんだい」おわり */
    fb.className = 'ok';
    fb.innerHTML = `◎ せいかい！　${esc(V.c.a)}は${V.A.n}倍、${esc(V.c.b)}は${V.B.n}倍。`
                 + `倍でくらべると${esc(win==='A'?V.c.a:V.c.b)}のほうが${esc(V.c.verb)}ね。`;
    a.className = 'answer filled pop';
    a.textContent = (win==='A' ? V.c.a : V.c.b);
  } else {
    showStamp('batsu');
    judgeNg();
    fb.className = 'ng';
    fb.innerHTML = '△ もういちど。のびた長さではなく、<b>何倍になったか</b>でくらべよう。';
  }
  updateScore();
}

<!-- ============================================================

     ・10問チャレンジ（Challenge10）とは べつの しくみ。始めると チャレンジは 切る。

<script>
window.TestRun = (function(){
  'use strict';
  const S = window.TEST_SETTEI;
  const P = Object.assign({ after:'#chal-mount', next:'#next', hint:'#hintBtn',
                            tabs:'#gtabs,#subTabs', chalBtn:'#btn-challenge' }, (S && S.parts) || {});
  const $ = id => document.getElementById(id);
  const q = sel => sel ? document.querySelector(sel) : null;

  /* ---- 土台に 必要な ものが あるか ---- */
  const lack = [];
  if(typeof MODES        !== 'object')   lack.push('MODES');
  if(typeof setMode      !== 'function') lack.push('setMode');
  if(typeof showHanamaru !== 'function') lack.push('showHanamaru');
  if(typeof applyJudge   !== 'function') lack.push('applyJudge');
  if(!S || !Array.isArray(S.tests) || !S.tests.length) lack.push('TEST_SETTEI.tests');
  if(lack.length){ console.warn('テストの練習：土台に ないので うごきません →', lack.join('・')); return null; }

  /* ---- せっていを たしかめる（ない 小タブは とばす）---- */
  const TESTS = S.tests.map(t => ({
    title: t.title || 'テスト',
    items: (t.items || []).filter(it => {
      if(it && MODES[it.mode]) return true;
      console.warn('テストの練習：小タブ「' + (it && it.mode) + '」が ないので とばします（' + t.title + '）');
      return false;
    })
  })).filter(t => t.items.length);
  if(!TESTS.length){ console.warn('テストの練習：出せる 大問が ありません'); return null; }

  const setOf = it => Object.assign({}, it.meth !== undefined ? { meth: it.meth } : {}, it.set || {});
  const itemName = it => it.name || ((MODES[it.mode].label || it.mode) + (MODES[it.mode].sub || ''));
  const nowMode = () => (typeof mode === 'string' ? mode : '');
  const waitMs = () => (typeof HANAMARU_SHOW_MS === 'number' ? HANAMARU_SHOW_MS : 2000)
                     + (typeof AUTO_NEXT_MS     === 'number' ? AUTO_NEXT_MS     : 1500);

  let run = null;   // { t, i, rec:[{miss,hint,st}], back, saved }
  let myTimer = 0;

  /* ---- 見た目（CSS は ここで 足す。土台の <style> は さわらない）---- */
  const css = document.createElement('style');
  css.id = 'test-style';
  css.textContent = [
    '#test-mount{position:relative;flex:0 0 auto;display:flex;align-items:center;}',
    '#test-btn{font-family:"Yusei Magic",sans-serif;font-size:clamp(13px,1.7vw,17px);padding:5px 14px;white-space:nowrap;',
    '  color:#138577;background:#e3f6f2;border:2px solid #7fd3c6;border-radius:20px;box-shadow:0 2px 0 #7fd3c6;cursor:pointer;}',
    '#test-btn:focus-visible,#test-menu button:focus-visible,#test-bar button:focus-visible,#test-result button:focus-visible{outline:3px solid #138577;outline-offset:2px;}',
    '#test-menu{display:none;position:absolute;top:calc(100% + 8px);right:0;z-index:950;background:#fff;border:3px solid #d8ccae;',
    '  border-radius:16px;padding:10px;box-shadow:0 8px 24px rgba(52,70,95,.20);flex-direction:column;gap:8px;min-width:270px;max-width:92vw;}',
    '#test-menu.open{display:flex;}',
    '#test-menu button{font-family:"Yusei Magic",sans-serif;font-size:17px;padding:11px 14px;border-radius:12px;border:3px solid #7fd3c6;',
    '  background:#fff;color:#34465f;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:14px;white-space:nowrap;}',
    '#test-menu button:hover{background:#f1fbf9;}',
    '#test-menu small{font-size:14px;color:#6a7d96;}',
    '#test-bar{display:none;align-items:center;gap:8px;background:rgba(255,255,255,.94);border:2px solid #7fd3c6;border-radius:20px;',
    '  padding:3px 5px 3px 12px;font-family:"Yusei Magic",sans-serif;color:#138577;white-space:nowrap;font-size:clamp(12px,1.5vw,16px);}',
    '#test-dots{letter-spacing:1px;}',
    '#test-stop{font-family:"Yusei Magic",sans-serif;font-size:.9em;padding:3px 10px;border-radius:14px;border:2px solid #d8ccae;background:#fff;color:#6a7d96;cursor:pointer;}',
    'body.testing #test-btn{display:none;}',
    'body.testing #test-bar{display:flex;}',
    'body.testing #chal-mount{display:none;}',
    P.tabs.split(',').map(s => 'body.testing ' + s.trim()).join(',') + '{pointer-events:none;opacity:.45;}',
    '#test-result{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center;}',
    '#test-result.show{display:flex;}',
    '#test-result .tr-card{background:#fff;border-radius:20px;padding:22px 26px;box-shadow:0 10px 40px rgba(0,0,0,.3);max-width:94vw;max-height:92vh;overflow:auto;',
    '  font-family:"Yusei Magic",sans-serif;color:#34465f;}',
    '#test-result .tr-title{font-size:clamp(20px,3vw,28px);color:#138577;text-align:center;margin-bottom:12px;}',
    '#test-result table{border-collapse:collapse;font-size:clamp(14px,2vw,19px);margin:0 auto;}',
    '#test-result td{padding:6px 10px;border-bottom:2px dashed #eadfc6;white-space:nowrap;}',
    '#test-result td.no{color:#6a7d96;}',
    '#test-result td.r-ok{color:#2bb673;}',
    '#test-result td.r-ng{color:#e85d3b;}',
    '#test-result td.r-sk{color:#9aa6b5;}',
    '#test-result .tr-sum{text-align:center;margin-top:12px;font-size:clamp(16px,2.4vw,22px);}',
    '#test-result .tr-sum b{color:#e85d3b;font-size:1.3em;}',
    '#test-result .tr-btns{display:flex;gap:12px;justify-content:center;margin-top:16px;}',
    '#test-result button{font-family:"Yusei Magic",sans-serif;font-size:18px;padding:11px 20px;border-radius:14px;cursor:pointer;}',
    '#test-again{color:#fff;background:#1fae9c;border:none;box-shadow:0 3px 0 #138577;}',
    '#test-close{color:#6a7d96;background:#fff;border:2px solid #d8ccae;}'
  ].join('\n');
  document.head.appendChild(css);

  /* ---- ボタン・メニュー・帯（10問チャレンジの となり）---- */
  const mount = document.createElement('div');
  mount.id = 'test-mount';
  mount.innerHTML =
      '<button id="test-btn" type="button">' + (S.button || '📝 テストの 練習') + '</button>'
    + '<div id="test-menu">'
    +   TESTS.map((t,k) => '<button type="button" data-k="'+k+'">'+t.title+'<small>'+t.items.length+'問</small></button>').join('')
    + '</div>'
    + '<div id="test-bar"><span id="test-no"></span><span id="test-dots"></span>'
    +   '<button id="test-stop" type="button">やめる</button></div>';
  const anchor = q(P.after);
  const header = document.querySelector('header');
  if(anchor && anchor.parentNode) anchor.parentNode.insertBefore(mount, anchor.nextSibling);
  else if(header) header.appendChild(mount);
  else document.body.insertBefore(mount, document.body.firstChild);
  const res = document.createElement('div');
  res.id = 'test-result';
  document.body.appendChild(res);

  /* テストが 1つだけなら、メニューを 出さずに すぐ 始める */
  $('test-btn').addEventListener('click', e => {
    e.stopPropagation();
    if(TESTS.length === 1){ start(0); return; }
    const m = $('test-menu');
    m.classList.toggle('open');
    if(m.classList.contains('open')) placeMenu();
  });
  /* せまい 画面で メニューが 左に はみ出す ときは、画面の 中へ ずらす */
  function placeMenu(){
    const m = $('test-menu');
    m.style.left = ''; m.style.right = '';
    const r = m.getBoundingClientRect(), mr = mount.getBoundingClientRect();
    if(r.left < 8){ m.style.right = 'auto'; m.style.left = (8 - mr.left) + 'px'; }
  }
  $('test-menu').addEventListener('click', e => {
    const b = e.target.closest('button[data-k]'); if(!b) return;
    $('test-menu').classList.remove('open');
    start(+b.dataset.k);
  });
  document.addEventListener('click', e => {
    if(!e.target.closest('#test-mount')) $('test-menu').classList.remove('open');
  });
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape') $('test-menu').classList.remove('open');
  });
  $('test-stop').addEventListener('click', () => stop());
  /* テストの あいだの「つぎの もんだい」は、その 大問を とばして つぎの 大問へ */
  document.addEventListener('click', e => {
    if(!run || !P.next || !e.target.closest(P.next)) return;
    e.stopPropagation(); e.preventDefault();
    skip();
  }, true);
  /* ヒントを 見たか（ボタンを おした あと hintOn が true なら）*/
  const hb = q(P.hint);
  if(hb) hb.addEventListener('click', () => setTimeout(() => {
    const r = cur();
    const on = (typeof hintOn === 'boolean') ? hintOn : true;
    if(r && on && r.st === 'todo') r.hint = true;
  }, 0));

  /* ---- 土台の 2つの 関数を つつむ（土台に もう 2行 入っていれば つつまない）---- */
  const BUILTIN = /TestRun/.test(String(showHanamaru)) || /TestRun/.test(String(applyJudge));
  if(!BUILTIN){
    const _show = showHanamaru;
    showHanamaru = function(){
      if(!run) return _show.apply(this, arguments);
      /* はなまるは ふつうに 出す。同じ モードの つぎの 問題へは 行かせない（noAutoNext を 一時的に）*/
      const m = (typeof M === 'object' && M) ? M : null;
      const had = m && Object.prototype.hasOwnProperty.call(m, 'noAutoNext');
      const old = m ? m.noAutoNext : undefined;
      try{ if(m) m.noAutoNext = true; }catch(e){}
      try{ _show.apply(this, arguments); }
      finally{ try{ if(m){ if(had) m.noAutoNext = old; else delete m.noAutoNext; } }catch(e){} }
      api.onDone();
    };
    const _judge = applyJudge;
    applyJudge = function(r){
      if(run && r && !r.ok && !r.skip) api.miss();
      return _judge.apply(this, arguments);
    };
  }

  /* ---- 中身 ---- */
  function cur(){ return run ? run.rec[run.i] : null; }
  function clearMine(){ clearTimeout(myTimer); myTimer = 0; }
  function bar(){
    if(!run) return;
    const T = TESTS[run.t], it = T.items[run.i];
    $('test-no').textContent = '📝 ' + (/^\d+$/.test(it.no) ? it.no+'問め' : it.no) + '（' + (run.i+1) + '／' + T.items.length + '）';
    $('test-dots').textContent = run.rec.map((r,i) => r.st==='done' ? '●' : r.st==='skip' ? '－' : (i===run.i ? '◎' : '○')).join('');
  }
  /* set で かえる 値を、はじめに 1回だけ おぼえておく */
  function saveSets(t){
    const saved = {};
    TESTS[t].items.forEach(it => {
      const o = setOf(it), md = MODES[it.mode];
      Object.keys(o).forEach(k => {
        const key = it.mode + '\u0000' + k;
        if(!(key in saved)) saved[key] = { md:md, k:k, had:Object.prototype.hasOwnProperty.call(md,k), v:md[k] };
      });
    });
    return saved;
  }
  function restoreSets(saved){
    Object.keys(saved || {}).forEach(key => {
      const s = saved[key];
      try{ if(s.had) s.md[s.k] = s.v; else delete s.md[s.k]; }catch(e){}
    });
  }
  function go(i){
    clearMine();
    run.i = i;
    const it = TESTS[run.t].items[i];
    const o = setOf(it);
    Object.keys(o).forEach(k => { try{ MODES[it.mode][k] = o[k]; }catch(e){} });
    setMode(it.mode);
    bar();
  }
  function start(t){
    const cb = q(P.chalBtn);
    if(window.Challenge10 && Challenge10.isOn && Challenge10.isOn() && cb) cb.click();
    res.classList.remove('show');
    let back = nowMode();
    if(run){ back = run.back; restoreSets(run.saved); }
    run = { t:t, i:0, rec:TESTS[t].items.map(() => ({ miss:0, hint:false, st:'todo' })), back:back, saved:saveSets(t) };
    document.body.classList.add('testing');
    go(0);
  }
  function next(){
    if(!run) return;
    if(run.i + 1 < run.rec.length) go(run.i + 1);
    else finish();
  }
  function skip(){
    const r = cur(); if(!r) return;
    if(r.st !== 'done') r.st = 'skip';
    clearMine();
    if(typeof clearAutoNext === 'function') clearAutoNext();
    next();
  }
  function finish(){
    clearMine();
    const T = TESTS[run.t];
    let perfect = 0;
    const rows = T.items.map((it,i) => {
      const r = run.rec[i];
      let tx, c;
      if(r.st==='done' && r.miss===0){ tx = '⭕ ノーミス'; c = 'r-ok'; perfect++; }
      else if(r.st==='done'){ tx = 'まちがい '+r.miss+'回'; c = 'r-ng'; }
      else { tx = 'とばした'; c = 'r-sk'; }
      return '<tr><td class="no">'+it.no+'</td><td>'+itemName(it)+'</td><td class="'+c+'">'+tx+'</td><td>'+(r.hint ? '💡' : '')+'</td></tr>';
    }).join('');
    res.innerHTML = '<div class="tr-card">'
      + '<div class="tr-title">📝 '+T.title+'　おわり！</div>'
      + '<table>'+rows+'</table>'
      + '<div class="tr-sum">ノーミスで できた 問題　<b>'+perfect+'</b> ／ '+T.items.length+'</div>'
      + '<div class="tr-btns"><button id="test-again" type="button">もう一度</button><button id="test-close" type="button">とじる</button></div>'
      + '</div>';
    res.classList.add('show');
    $('test-again').onclick = () => start(run.t);
    $('test-close').onclick = () => stop();
    $('test-again').focus();
  }
  /* やめる／とじる：set で かえた 値を もどして、はじめの タブへ */
  function stop(){
    if(!run) return;
    const back = run.back, saved = run.saved;
    run = null;
    clearMine();
    res.classList.remove('show');
    document.body.classList.remove('testing');
    restoreSets(saved);
    setMode(back && MODES[back] ? back : TESTS[0].items[0].mode);
  }

  const api = {
    on: () => !!run,
    /* showHanamaru から：その 大問は おわり。はなまるの あと つぎの 大問へ */
    onDone(){
      if(!run || res.classList.contains('show')) return !!run;
      const r = cur(); r.st = 'done';
      bar();
      clearMine();
      const go2 = () => { if(typeof autoTimers !== 'undefined') autoTimers = []; next(); };
      if(typeof autoTimers !== 'undefined' && Array.isArray(autoTimers)) autoTimers.push(setTimeout(go2, waitMs()));
      else myTimer = setTimeout(go2, waitMs());
      return true;
    },
    /* applyJudge から：まちがい（skip で ない もの）*/
    miss(){ const r = cur(); if(r && r.st === 'todo') r.miss++; },
    /* 外から つかう とき用 */
    start: t => start(t || 0),
    stop:  () => stop(),
    record: () => run ? JSON.parse(JSON.stringify(run.rec)) : null
  };
  return api;
})();
</script>

<!-- ============================================================
     📝 テストの 練習 ③このアプリに合わせる（見た目と ボタンの文字）
     ============================================================ -->
<script>
/* テスト中は「つぎのもんだい」が「とばす」になるので、文字も変える */
(function(){
  const btn = document.getElementById('btn-next');
  const base = btn.textContent;
  new MutationObserver(()=>{
    btn.textContent = document.body.classList.contains('testing') ? 'とばす ▶' : base;
  }).observe(document.body, {attributes:true, attributeFilter:['class']});
})();
</script>
<style>
  /* ②しくみ のCSSを、このアプリの字と大きさに合わせる（②はさわらない） */
  #test-btn{font-family:var(--font);font-size:clamp(11px,1.6vh,14px);font-weight:700;padding:5px 13px;}
  #test-bar{font-family:var(--font);font-size:clamp(11px,1.5vh,14px);padding:3px 4px 3px 12px;
            border-color:#9FD8CE;color:#0E7C6E;}
  #test-stop{font-family:var(--font);font-weight:700;border-color:var(--rule);}
  #test-menu{border-color:var(--rule);}
  #test-menu button{font-family:var(--font);font-size:15px;padding:9px 12px;border-color:#9FD8CE;color:var(--ink);}
  #test-result .tr-card,#test-result button{font-family:var(--font);color:var(--ink);}
  #test-result td{border-bottom-color:var(--rule);}
  #test-result .tr-title{color:#0E7C6E;}
  /* テスト中は、ヘッダーの席をあけるためにわきの表示を消す */
  body.testing .sub,body.testing .reset{display:none;}
  @media (max-width:820px){ body.testing .score{display:none;} }

</style>
